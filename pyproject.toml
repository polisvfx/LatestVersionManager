[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latest-version-manager"
dynamic = ["version"]
description = "VFX version promotion tool for managing versioned file sequences"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "PySide6>=6.6,<7",
    "watchdog>=4.0,<6",
    "imageio-ffmpeg>=0.5.1",
]

[tool.setuptools.dynamic]
version = {attr = "lvm.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["build", "dist", ".git"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
